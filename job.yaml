kind: Job
apiVersion: batch/v1
metadata:
  name: nginx-job
  namespace: default
spec:
  completions: 2
  parallelism: 1
  template:
     metadata:
       name: nginx-job
       labels:
         app: nginx-job
     spec:
       containers:
       - name: busybox
         image: busybox:latest
         command: ["sh", "-c", "echo Hello Kubernetes! && sleep 30"]
       restartPolicy: Never  